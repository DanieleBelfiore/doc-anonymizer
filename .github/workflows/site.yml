name: Site

# The public page in site/ and its contact function: tests/*.test.mjs with the coverage floor, then the production deploy on Netlify.
on:
  push:
    branches: [main]
    paths: &site
      - "site/**"
      - "netlify/**"
      - "netlify.toml"
      - "scripts/site-en.mjs"
      - "tests/*.test.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths: *site

permissions:
  contents: read

jobs:
  # Pull requests only: the merge commit has the tree the PR already tested.
  site:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Node 24 bundles npm 11, which ignores min-release-age in .npmrc.
      - name: Install npm 12
        run: npm install -g npm@12
      - run: npm ci
      - run: npm run test:coverage

  # Production deploy on Netlify when the merge reaches main (Netlify's git builds are off).
  # The tests ran on the pull request: main only receives PRs from develop.
  # `netlify build` runs without the token: it reaches only the upload.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      AWS_LAMBDA_JS_RUNTIME: nodejs24.x
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Node 24 bundles npm 11, which ignores min-release-age in .npmrc.
      - name: Install npm 12
        run: npm install -g npm@12
      - run: npm ci
      - run: npm install -g --ignore-scripts netlify-cli@27.16.2
      - run: netlify build --offline --context production
      # Every name in .env.example must exist on the Netlify site, not left at the DA_SOSTITUIRE placeholder (values never printed).
      - name: Check Netlify env vars
        run: |
          netlify env:list --json --context production --site "$NETLIFY_SITE_ID" \
            | jq -r 'to_entries[] | select(.value != "DA_SOSTITUIRE") | .key' | sort > "$RUNNER_TEMP/env-present"
          missing=$(grep -oE '^[A-Z][A-Z0-9_]*' .env.example | sort -u | comm -23 - "$RUNNER_TEMP/env-present")
          for name in $missing; do echo "::error::$name is missing on Netlify or still DA_SOSTITUIRE"; done
          test -z "$missing"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - run: netlify deploy --prod --no-build --message "${GITHUB_SHA::7} via GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

      # Synthetic form check, the same request as repo-audit's weekly one: with the token the email goes
      # only to delivered@resend.dev and nothing is saved. The server confirms with `x-synthetic-test: on`.
      - name: Synthetic form check
        run: |
          status=$(curl --max-time 30 -sS -o /dev/null -D "$RUNNER_TEMP/headers" -w '%{http_code}' -X POST "https://doc-anonymizer.danielebelfiore.dev/api/contact" \
            -H 'content-type: application/x-www-form-urlencoded' -H 'accept: application/json' -H "x-synthetic-test: $SYNTHETIC_TEST_TOKEN" \
            --data 'name=Synthetic+Check&email=delivered%40resend.dev&message=Weekly+synthetic+test+of+the+contact+form.')
          echo "status $status (expected 200), x-synthetic-test: $(grep -i '^x-synthetic-test:' "$RUNNER_TEMP/headers" | cut -d' ' -f2 | tr -d '\r')"
          test "$status" = 200 && grep -qi '^x-synthetic-test: on' "$RUNNER_TEMP/headers"
        env:
          SYNTHETIC_TEST_TOKEN: ${{ secrets.SYNTHETIC_TEST_TOKEN }}
