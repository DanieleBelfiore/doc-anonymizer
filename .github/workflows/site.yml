name: Site

# The public page in site/ and its contact function: tests/*.test.mjs, then the production deploy on Netlify.
on:
  push:
    branches: [main]
    paths: &site
      - "site/**"
      - "netlify/**"
      - "netlify.toml"
      - "scripts/site-en.mjs"
      - "tests/*.test.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths: *site

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:site

  # Production deploy on Netlify, only after the tests (Netlify's git builds are off).
  # `netlify build` runs without the token: it reaches only the upload.
  deploy:
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      AWS_LAMBDA_JS_RUNTIME: nodejs24.x
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g --ignore-scripts netlify-cli@27.16.2
      - run: netlify build --offline --context production
      - run: netlify deploy --prod --no-build --message "${GITHUB_SHA::7} via GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
