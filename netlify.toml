# The public page: plain files in site/, served as they are, with no build step,
# plus the contact function in netlify/functions/.
[build]
  publish = "site"
  command = ""
  # Skip the deploy when nothing under site/, netlify/, the package files or this file changed (exit 0 = skip).
  # When both refs match (first deploy, manual redeploy) the test fails and the deploy runs.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site netlify netlify.toml package.json package-lock.json'

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    # The hash is the inline script in site/index.html that adds the "js" class; recompute it if that line changes.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://just-analytics.danielebelfiore.dev; connect-src 'self' https://just-analytics.danielebelfiore.dev; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
